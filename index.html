<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Title & SEO Metadata -->
    <title>SINC 3D | Engineering Maritime Domain Awareness & Advanced Sensory Systems</title>
    <meta name="description" content="SINC 3D pioneers next-generation maritime domain awareness, naval sensing arrays, and edge AI telemetry solutions for mission-critical operations worldwide." />
    <meta name="keywords" content="SINC 3D, maritime domain awareness, naval sensing arrays, edge AI telemetry, ocean surveillance, sub-surface detection" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sinc-2.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sinc-2.vercel.app/" />
    <meta property="og:title" content="SINC 3D | Engineering Maritime Domain Awareness" />
    <meta property="og:description" content="SINC 3D pioneers next-generation maritime domain awareness, naval sensing arrays, and edge AI telemetry solutions for mission-critical operations worldwide." />
    <meta property="og:image" content="https://sinc-2.vercel.app/assets/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://sinc-2.vercel.app/" />
    <meta name="twitter:title" content="SINC 3D | Engineering Maritime Domain Awareness" />
    <meta name="twitter:description" content="SINC 3D pioneers next-generation maritime domain awareness, naval sensing arrays, and edge AI telemetry solutions." />
    <meta name="twitter:image" content="https://sinc-2.vercel.app/assets/logo.png" />

    <!-- Performance Preloads -->
    <link rel="preload" as="image" href="/assets/hero-poster.webp" />
  </head>
  <body>
    <div id="root">
      <!-- Static HTML representation for fast FCP/LCP -->
      <div style="background-color: #050505; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 9999;">
        <!-- Background Poster Image -->
        <img src="/assets/hero-poster.webp" alt="Ocean surveillance background" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;" />
        
        <!-- Black-to-transparent gradient overlay -->
        <div style="position: absolute; inset: 0; z-index: 1; background: linear-gradient(to top, #050505 0%, #050505 40%, transparent 70%, transparent 100%); opacity: 0.4;"></div>

        <!-- Centered Logo -->
        <img src="/assets/logo.png" alt="SINC Logo" style="position: relative; max-width: 85%; height: 60px; object-fit: contain; z-index: 2;" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
